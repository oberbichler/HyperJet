name: Format

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # The file list is discovered rather than spelled out: a hand-maintained
      # list silently stops covering a new directory, and an entry whose glob
      # matches nothing makes clang-format fail on the literal pattern. The .in
      # templates are excluded on purpose -- they hold CMake @SUBSTITUTIONS@ and
      # are not valid C++ until configured.
      - name: Check C++ formatting
        run: uv run --only-group dev clang-format --dry-run --Werror $(git ls-files '*.h' '*.hpp' '*.cpp')

      - name: Check Python formatting
        run: uv run --only-group dev ruff format --check python/tests/
